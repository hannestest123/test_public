name: Sync PUBLIC comments to private issue

on:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  sync-public-comment:
    if: github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TO_PRIVATE_TOKEN }}
      PRIVATE_REPO: ${{ vars.PRIVATE_REPO }}
      PUBLIC_REPO: ${{ github.event.repository.name }}
      PUBLIC_ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_AUTHOR: ${{ github.event.comment.user.login }}

    steps:
      - name: Find private issue and comment
        id: find
        run: |
          MARKER="<!-- SYNC: public_repo=$PUBLIC_REPO public_issue=$PUBLIC_ISSUE_NUMBER -->"

          EXISTING=$(gh api "search/issues?q=$(jq -rn --arg q "$MARKER repo:$PRIVATE_REPO is:issue" '$q | @uri')" \
            | jq -r '.items[0].number')

          if [ -z "$EXISTING" ] || [ "$EXISTING" = "null" ]; then
            echo "Kein passendes private Issue gefunden"
            exit 1
          fi

          echo "Gefundenes private Issue: #$EXISTING"
          echo "issue_number=$EXISTING" >> $GITHUB_OUTPUT

          EXISTING_COMMENT=$(gh api "repos/$PRIVATE_REPO/issues/$EXISTING/comments" \
            | jq -r ".[] | select(.body | contains(\"comment-id: $COMMENT_ID\")) | .id")

          echo "comment_id=$EXISTING_COMMENT" >> $GITHUB_OUTPUT

      - name: Create comment
        if: github.event.action == 'created'
        env:
          EXISTING: ${{ steps.find.outputs.issue_number }}
        run: |
          cat > /tmp/comment.md << EOF
          <!-- comment-id: "$COMMENT_ID" -->
          **@"$COMMENT_AUTHOR"** created comment:

          "$COMMENT_BODY"
          EOF

          echo "Syncing PUBLIC comment to $PRIVATE_REPO#$EXISTING"

          gh issue comment "$EXISTING" \
            --repo "$PRIVATE_REPO" \
            --body-file /tmp/comment.md

      - name: Edit comment
        if: github.event.action == 'edited'
        env:
          EXISTING: ${{ steps.find.outputs.issue_number }}
          EXISTING_COMMENT: ${{ steps.find.outputs.comment_id }}
        run: |
          if [ -z "$EXISTING_COMMENT" ] || [ "$EXISTING_COMMENT" = "null" ]; then
            echo "Kein passender Kommentar gefunden für comment-id: $COMMENT_ID"
            exit 1
          fi

          echo "Gefundener Kommentar: $EXISTING_COMMENT"

          cat > /tmp/comment.md << EOF
          <!-- comment-id: "$COMMENT_ID" -->
          **@"$COMMENT_AUTHOR"** edited comment:

          "$COMMENT_BODY"
          EOF

          gh api --method PATCH "repos/$PRIVATE_REPO/issues/comments/$EXISTING_COMMENT" \
            --field body=@/tmp/comment.md

      - name: Delete comment
        if: github.event.action == 'deleted'
        env:
          EXISTING_COMMENT: ${{ steps.find.outputs.comment_id }}
        run: |
          if [ -z "$EXISTING_COMMENT" ] || [ "$EXISTING_COMMENT" = "null" ]; then
            echo "Kein passender Kommentar gefunden für comment-id: $COMMENT_ID"
            exit 1
          fi

          echo "Lösche Kommentar: $EXISTING_COMMENT"

          gh api --method DELETE "repos/$PRIVATE_REPO/issues/comments/$EXISTING_COMMENT"