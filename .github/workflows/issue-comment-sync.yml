name: Sync PUBLIC comments to public issue

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  sync-public-comment:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      PUBLIC_OWNER: ${{ github.repository_owner }}
      PUBLIC_REPO: ${{ github.event.repository.name }}
      PUBLIC_ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
      COMMENT_ACTION: ${{ github.event.action }}
      
    steps:
      - name: Create comment
        if: github.event.action == 'created'
        run: |
          # Private Issue per Marker suchen
          MARKER="<!-- SYNC: public_repo=$PUBLIC_OWNER/$PUBLIC_REPO public_issue=$PUBLIC_ISSUE_NUMBER -->"
          
          EXISTING=$(gh issue list \
            --repo "$PRIVATE_OWNER/$PRIVATE_REPO" \
            --state all \
            --search "$MARKER in:body" \
            --limit 1 \
            | awk '{print $1}' || true)

          if [ -z "$EXISTING" ]; then
            echo "Kein passendes private Issue gefunden"
            exit 1
          fi

          echo "Gefundenes private Issue: #$EXISTING"

          # Kommentar erstellen
          COMMENT_MARKER="<!-- comment-id: $COMMENT_ID -->"
          cat > /tmp/comment.md << EOF
          $COMMENT_MARKER
          **@$COMMENT_AUTHOR** schrieb:

          $COMMENT_BODY
          EOF


      - name: Edit comment
        if: github.event.action == 'edited'
        run: |

      - name: Delete comment
        if: github.event.action == 'deleted'
        run: |
    