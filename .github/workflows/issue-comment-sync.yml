name: Sync PUBLIC comments to public issue

on:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read

jobs:
  sync-public-comment:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_TO_PRIVATE_TOKEN }}
      PRIVATE_REPO: ${{ vars.PRIVATE_REPO }}
      PUBLIC_REPO: ${{ github.event.repository.name }}
      PUBLIC_ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_AUTHOR: ${{ github.event.comment.user.login }}

    steps:
      - name: Create comment
        if: github.event.action == 'created' && github.event.comment.user.type != 'Bot'
        run: |

          # Sucht das entsprechende ISSUE im private repository anhand des Markers (EXISTING hält dann die Nummer des ISSUES)

          MARKER="<!-- SYNC: public_repo=${PUB_REPO} public_issue=${ISSUE_NUMBER} -->"

          EXISTING=$(gh issue list \
            --repo "$PRIVATE_REPO" \
            --state all \
            --search "$MARKER in:body" \
            --limit 1 \
            | awk '{print $1}' \
            | tr -d '#' || true)

          if [ -z "$EXISTING" ]; then
            echo "Kein passendes private Issue gefunden"
            exit 1
          fi

          echo "Gefundenes private Issue: #$EXISTING"

          # Erstellt Body des neuen Kommentars (enthält Autor, weil Autor des privaten Kommentars der Bot ist und es so nicht möglich wäre den Autor zu sehen)
          COMMENT_MARKER="<!-- comment-id: $COMMENT_ID -->"
          cat > /tmp/comment.md << EOF
          $COMMENT_MARKER
          **@$COMMENT_AUTHOR** created comment:

          $COMMENT_BODY
          EOF

          echo "Syncing PUBLIC comment to $PRIVATE_REPO_REPO#$PUBLIC_ISSUE_NUMBER"
          
          # Kommentiert das ISSUE im privaten Repository mit oben erstellten Body
          gh issue comment "$EXISTING" \
            --repo "$PRIVATE_REPO" \
            --body-file /tmp/comment.md



      - name: Edit comment
        if: github.event.action == 'edited' && github.event.comment.user.type != 'Bot'
        run: |
          # Sucht das entsprechende ISSUE im private repository anhand des Markers (EXISTING hält dann die Nummer des ISSUES)
          MARKER="<!-- SYNC: public_repo=${PUB_REPO} public_issue=${ISSUE_NUMBER} -->"
          
          EXISTING=$(gh issue list \
            --repo "$PRIVATE_REPO" \
            --state all \
            --search "$MARKER in:body" \
            --limit 1 \
            | awk '{print $1}' \
            | tr -d '#')

          echo "EXISTING: $EXISTING"
          echo "Repo: $PRIVATE_OWNER/$PRIVATE_REPO"

          # Kommentar im private Repo anhand des Markers finden
          COMMENT_MARKER="<!-- comment-id: $COMMENT_ID -->"
          EXISTING_COMMENT=$(gh api repos/$PRIVATE_REPO/issues/$EXISTING/comments \
            | jq -r ".[] | select(.body | contains($COMMENT_MARKER)) | .id")

          if [ -z "$EXISTING_COMMENT" ]; then
            echo "Kein passender Kommentar gefunden für comment-id: $COMMENT_ID"
            exit 1
          fi

          echo "Gefundener Kommentar: $EXISTING_COMMENT"

          # Erstellt geänderten Body
          COMMENT_MARKER="<!-- comment-id: $COMMENT_ID -->"
          cat > /tmp/comment.md << EOF
          $COMMENT_MARKER
          **@$COMMENT_AUTHOR** edited comment:

          $COMMENT_BODY
          EOF

          # Kommentar updaten via github API Call
          gh api --method PATCH repos/$PRIVATE_REPO/issues/comments/$EXISTING_COMMENT \
            --field body=@/tmp/comment.md



      - name: Delete comment
        if: github.event.action == 'deleted' && github.event.comment.user.type != 'Bot'
        run: |
          # Sucht das entsprechende ISSUE im private repository anhand des Markers (EXISTING hält dann die Nummer des ISSUES)
          MARKER="<!-- SYNC: public_repo=${PUB_REPO} public_issue=${ISSUE_NUMBER} -->"
          
          EXISTING=$(gh issue list \
            --repo "$PRIVATE_REPO" \
            --state all \
            --search "$MARKER in:body" \
            --limit 1 \
            | awk '{print $1}' \
            | tr -d '#')

          echo "EXISTING: $EXISTING"
          echo "Repo: $PRIVATE_OWNER/$PRIVATE_REPO"

          # Kommentar im private Repo anhand des Markers finden
          COMMENT_MARKER="<!-- comment-id: $COMMENT_ID -->"
          EXISTING_COMMENT=$(gh api repos/$PRIVATE_REPO/issues/$EXISTING/comments \
            | jq -r ".[] | select(.body | contains($COMMENT_MARKER)) | .id")

          if [ -z "$EXISTING_COMMENT" ]; then
            echo "Kein passender Kommentar gefunden für comment-id: $COMMENT_ID"
            exit 1
          fi

          echo "Gefundener Kommentar: $EXISTING_COMMENT"

          # Erstellt geänderten Body
          COMMENT_MARKER="<!-- comment-id: $COMMENT_ID -->"
          cat > /tmp/comment.md << EOF
          $COMMENT_MARKER
          **@$COMMENT_AUTHOR** edited comment:

          $COMMENT_BODY
          EOF

          # Kommentar löschen via Github API Call
          gh api --method DELETE repos/$PRIVATE_REPO/issues/comments/$EXISTING_COMMENT


    